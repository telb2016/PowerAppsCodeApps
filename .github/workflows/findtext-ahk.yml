name: findtext-ahk

on:
  push:
    paths: ['tools/findtext-ahk/**', '.github/workflows/findtext-ahk.yml']
  pull_request:
    paths: ['tools/findtext-ahk/**', '.github/workflows/findtext-ahk.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: tools/findtext-ahk

jobs:
  # Everything that does not need a real screen. Wine on Linux, so it is cheap
  # enough to gate every push.
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install wine and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 xvfb unzip curl

      - name: syntax check + core logic tests
        run: ./tests/run-wine-tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-test-results
          path: tools/findtext-ahk/TestResults.txt
          if-no-files-found: ignore

  # The parts Wine cannot reach: the real Windows OCR engine, real screen
  # capture, and the real pointer.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install AutoHotkey v2 (portable, no admin needed)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.autohotkey.com/download/ahk-v2.zip -OutFile ahk2.zip
          Expand-Archive ahk2.zip -DestinationPath ahk2 -Force
          "AHK=$PWD\ahk2\AutoHotkey64.exe" | Out-File -Append $env:GITHUB_ENV

      - name: fetch OCR.ahk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Lib | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/Descolada/OCR/main/Lib/OCR.ahk -OutFile Lib\OCR.ahk

      - name: syntax check on real Windows
        shell: pwsh
        run: |
          $files = @('Lib\FindTextCore.ahk','FindText.ahk','Doctor.ahk','Probe.ahk','Example_Hotkeys.ahk','Tests.ahk')
          $bad = 0
          foreach ($f in $files) {
            # /ErrorStdOut must precede /validate, or a parse error opens a
            # dialog and the job hangs until it times out
            & $env:AHK /ErrorStdOut /validate $f
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL $f"; $bad++ } else { Write-Host "ok   $f" }
          }
          if ($bad -gt 0) { exit 1 }

      - name: core logic tests
        shell: pwsh
        run: |
          & $env:AHK /ErrorStdOut Tests.ahk
          $rc = $LASTEXITCODE
          if (Test-Path TestResults.txt) { Get-Content TestResults.txt }
          exit $rc

      # Reports the environment without asserting. A runner with no OCR
      # language pack fails the doctor for environmental reasons, and this is
      # how you tell that apart from a real code failure.
      - name: probe the environment (never fails)
        shell: pwsh
        continue-on-error: true
        run: |
          & $env:AHK /ErrorStdOut Probe.ahk
          if (Test-Path ProbeResults.txt) { Get-Content ProbeResults.txt }

      # Real end-to-end: draws known text, OCRs it, checks the position, tests
      # the pointer. Needs an interactive desktop and an OCR language pack.
      - name: doctor - end-to-end on a real desktop
        shell: pwsh
        continue-on-error: true
        run: |
          & $env:AHK /ErrorStdOut Doctor.ahk
          Write-Host "Doctor exit code: $LASTEXITCODE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: |
            tools/findtext-ahk/TestResults.txt
            tools/findtext-ahk/ProbeResults.txt
          if-no-files-found: ignore
